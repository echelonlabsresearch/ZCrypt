# Added by validator-up.sh when the published image cannot be pulled. A normal tag,
# never a digest: Docker rejects `build` when the image name contains @sha256.
services:
  validator-abci:
    image: zcrypt-abci:local
    pull_policy: never
    build:
      context: ..
      dockerfile: chain/docker/Dockerfile
      args:
        # Empty is production. devnet turns on the faucet; do not set it on a public chain.
        ABCI_FEATURES: ${ABCI_FEATURES:-}
