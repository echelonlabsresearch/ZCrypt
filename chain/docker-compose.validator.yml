# Become a ZCrypt validator. Plug-and-play: download this file, run one command, then bond.
#
#   ./validator-up.sh                                         # installs Compose v2 if needed, pulls or builds, starts
#   ./validator-bond.sh                                       # then bond to start producing
#
# It generates its own validator identity, downloads the chain's genesis, dials the public
# seed node, and syncs. You never touch the genesis file. Watch it:
#
#   docker logs -f zcrypt-validator-cometbft
#   curl -s localhost:56657/status | grep catching_up
#
# The defaults below point at the public foundation. To join a DIFFERENT chain (e.g. a
# local test foundation), drop a `.env` next to this file overriding GENESIS_URL / SEED_*.
#
# Supply chain: this file pulls the shipped image, ghcr.io/echelonlabsresearch/zcrypt-abci:mainnet.
# The testnet branch is the same mainnet program before it has shipped. validator-up.sh
# selects the :testnet tag while you are on that branch. A release tag also publishes a
# digest; pin it with ZCRYPT_ABCI_IMAGE in .env after you verify the cosign signature
# (README-validator.md). If the repository moves to another GitHub org, change the owner
# here, in README-validator.md and in image.yml.

name: zcrypt-validator

services:
  # This validator's own ABCI state machine. The foundation address (and everything else)
  # comes from the downloaded genesis, so there is nothing to configure here.
  validator-abci:
    # Shipped image. validator-up.sh overrides this with :testnet on the testnet branch
    # (mainnet code that has not shipped). No `build:` here: a digest cannot be a build
    # tag, and `up` must pull. Source builds go through validator-up.sh.
    image: ${ZCRYPT_ABCI_IMAGE:-ghcr.io/echelonlabsresearch/zcrypt-abci:mainnet}
    pull_policy: always
    container_name: zcrypt-validator-abci
    restart: unless-stopped
    environment:
      ABCI_PORT: "26658"
      ZCRYPT_STATE_DB: /data/zcrypt-state.db
      ZCRYPT_STATE_FILE: /data/zcrypt-state.bin
      ZCRYPT_BACKUP_EVERY: ${ZCRYPT_BACKUP_EVERY:-1000}
      ZCRYPT_VESTING_ACCEL: ${ZCRYPT_VESTING_ACCEL:-1}
      # NOTE: the Bitcoin SPV network + checkpoint and the zBTC reserve key are NOT set here.
      # They live in the genesis this node downloads from the seed, so the abci configures the
      # identical Bitcoin anchor at InitChain automatically. A validator sets NOTHING for the
      # bridge.
    volumes:
      - validator-abci-data:/data
    networks: [vnet]

  # This validator's CometBFT node: own identity, downloads genesis, dials the seed.
  # Runs as the image's unprivileged `cometbft` user (the volume is owned by it).
  validator-cometbft:
    image: cometbft/cometbft:v0.38.17
    container_name: zcrypt-validator-cometbft
    restart: unless-stopped
    depends_on:
      - validator-abci
    environment:
      CHAIN_ID: ${CHAIN_ID:-zcrypt-1}
      ABCI_ADDR: tcp://validator-abci:26658
      # How to find the chain. By default everything comes from the foundation's public RPC
      # edge (Caddy, HTTPS): the genesis (SEED_RPC/genesis) and a peer (SEED_RPC/status).
      # Override SEED_RPC/SEED_P2P_* in .env to join a different chain (e.g. a local
      # foundation). GENESIS_URL is an optional static-file override.
      SEED_RPC: ${SEED_RPC:-https://rpc.zcrypt.network}
      SEED_P2P_HOST: ${SEED_P2P_HOST:-rpc.zcrypt.network}
      SEED_P2P_PORT: ${SEED_P2P_PORT:-26656}
      GENESIS_URL: ${GENESIS_URL:-}
      # The SHA-256 the foundation published for genesis.json. When set, the node refuses to
      # start on any genesis whose hash differs (protects against a poisoned download).
      GENESIS_SHA256: ${GENESIS_SHA256:-}
      # Optional: skip auto-discovery by giving the full seed string <node_id>@host:26656.
      ZCRYPT_SEEDS: ${ZCRYPT_SEEDS:-}
      RPC_CORS_ORIGINS: ${RPC_CORS_ORIGINS:-[]}
      # The validator identity from the wallet (Rewards, Run a validator, Node setup):
      # base64 of priv_validator_key.json. Set it in .env BEFORE the first start.
      VALIDATOR_KEY: ${VALIDATOR_KEY:-}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./docker/validator-entrypoint.sh:/entrypoint.sh:ro
      - validator-cometbft-data:/cometbft
    ports:
      # This validator's RPC: localhost-only unless you deliberately open it
      # (VALIDATOR_RPC_BIND=0.0.0.0:56657 puts an unauthenticated RPC on the internet).
      - "${VALIDATOR_RPC_BIND:-127.0.0.1:56657}:26657"
      - "${VALIDATOR_P2P_PORT:-56656}:26656"   # P2P (reachable so peers can dial back)
    networks: [vnet]

volumes:
  validator-abci-data:
  validator-cometbft-data:

networks:
  vnet:
    driver: bridge
