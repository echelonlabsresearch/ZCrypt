# Foundation stack: one VPS, one `docker compose up`:
#   abci + cometbft + explorer + caddy (HTTPS edge for explorer.* and rpc.*)
#   P2P 26656 published on the HOST for validators / firewall
# Optional:
#   --profile bridge  -> bridge_watcher (needs the reserve key SECRET file, see below)
#   --profile dev     -> regtest bitcoind, bound to localhost (local demos only)
#
# DNS before public TLS: EXPLORER_DOMAIN and RPC_DOMAIN both A -> this machine's IP.
# Copy env:  cp .env.example .env
#
# Security posture of this file:
#   * the ABCI image runs as an unprivileged user (uid 10001) and owns /data;
#   * the raw CometBFT RPC is published on 127.0.0.1 only; the internet reaches the node
#     solely through Caddy (allow-listed endpoints, per-IP rate limits, 8 MB body cap);
#   * the bridge reserve key is a Docker SECRET mounted read-only at /run/secrets, never an
#     environment variable (env is visible in `docker inspect` and /proc);
#   * bitcoind (dev profile) never listens on a public interface.

services:
  abci:
    build:
      context: ..
      dockerfile: chain/docker/Dockerfile
      args:
        # PRODUCTION build by default (no features). Mainnet-grade FRI parameters are
        # compiled into every binary unconditionally. Local faucet: ABCI_FEATURES=devnet
        ABCI_FEATURES: ${ABCI_FEATURES:-}
    container_name: zcrypt-abci
    restart: unless-stopped
    environment:
      ABCI_PORT: "26658"
      # RocksDB consensus state + periodic postcard backup, both on the /data volume.
      ZCRYPT_STATE_DB: /data/zcrypt-state.db
      ZCRYPT_STATE_FILE: /data/zcrypt-state.bin
      # Blocks between full postcard backups of the state (default 1000).
      ZCRYPT_BACKUP_EVERY: ${ZCRYPT_BACKUP_EVERY:-1000}
    volumes:
      - abci-data:/data
    networks:
      - zcrypt-net

  cometbft:
    image: cometbft/cometbft:v0.38.17
    container_name: zcrypt-cometbft
    restart: unless-stopped
    depends_on:
      - abci
    environment:
      COMETBFT_HOME: /cometbft
      CHAIN_ID: ${CHAIN_ID:-zcrypt-1}
      ABCI_ADDR: tcp://abci:26658
      ZCRYPT_FOUNDATION_ADDR: ${ZCRYPT_FOUNDATION_ADDR:-}
      ZCRYPT_BTC_NET: ${ZCRYPT_BTC_NET:-mainnet}
      ZCRYPT_BTC_CHECKPOINT: ${ZCRYPT_BTC_CHECKPOINT:-}
      # 33-byte compressed reserve PUBLIC key (hex) baked into genesis as `zbtc_reserve_pk`;
      # the node registers zBTC against it at InitChain (see cometbft-entrypoint.sh).
      ZCRYPT_RESERVE_PK: ${ZCRYPT_RESERVE_PK:-}
      # Foundation reserved-asset key-set commitment (64 hex) baked into genesis as
      # `reserved_mint_authority`; empty parks the reserved tickers for good.
      ZCRYPT_RESERVED_MINT_AUTH: ${ZCRYPT_RESERVED_MINT_AUTH:-}
      FOUNDATION_SENTINEL: ${FOUNDATION_SENTINEL:-true}
      FOUNDATION_SENTINEL_DECAY: ${FOUNDATION_SENTINEL_DECAY:-1000000}
      # JSON array of allowed browser origins for the raw RPC (default: none).
      RPC_CORS_ORIGINS: ${RPC_CORS_ORIGINS:-[]}
      # Genesis validator identity from the foundation wallet (Rewards, Run a validator,
      # Node setup): base64 of priv_validator_key.json. Set BEFORE the first start.
      VALIDATOR_KEY: ${VALIDATOR_KEY:-}
    volumes:
      - ./docker/cometbft-entrypoint.sh:/entrypoint.sh:ro
      - cometbft-data:/cometbft
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    # P2P on the HOST (open this in the VPS firewall for other validators).
    # Raw RPC bound to localhost by default: public RPC goes through Caddy (rpc.*).
    ports:
      - "${FOUNDATION_P2P_PORT:-26656}:26656"
      - "${FOUNDATION_RPC_PORT:-127.0.0.1:36657}:26657"
    networks:
      - zcrypt-net

  explorer:
    build:
      context: ..
      dockerfile: chain/docker/Dockerfile
      args:
        ABCI_FEATURES: ${ABCI_FEATURES:-}
    container_name: zcrypt-explorer
    restart: unless-stopped
    depends_on:
      - cometbft
    command: ["zcrypt-explorer"]
    environment:
      # Inside the compose network, not the host-published RPC port
      EXPLORER_NODE: http://cometbft:26657
      EXPLORER_PORT: "8080"
    networks:
      - zcrypt-net

  caddy:
    # Stock Caddy plus the rate-limit plugin (chain/docker/Dockerfile.caddy).
    build:
      context: ./docker
      dockerfile: Dockerfile.caddy
    container_name: zcrypt-caddy
    restart: unless-stopped
    depends_on:
      - explorer
      - cometbft
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      EXPLORER_DOMAIN: ${EXPLORER_DOMAIN:-explorer.localhost}
      RPC_DOMAIN: ${RPC_DOMAIN:-rpc.localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - zcrypt-net

  # Public bridge operator: NOT started by default (needs the hot reserve key).
  #   1. put the DERIVED reserve key (64 hex, H("BTCBRDG", wallet seed); write it with
  #      `reserve_pubkey --wallet-seed-file <custody seed> --write-derived-key secrets/reserve.key`)
  #      in ./secrets/reserve.key (chmod 600, never commit it)
  #   2. docker compose --profile bridge up -d
  # The daemon reads the key from ZCRYPT_RESERVE_KEY_FILE (a read-only secret mount); the
  # ZCRYPT_RESERVE_SEED environment variable is no longer used by this compose file.
  bridge-watcher:
    profiles: ["bridge"]
    build:
      context: ..
      dockerfile: chain/docker/Dockerfile
      args:
        ABCI_FEATURES: ${ABCI_FEATURES:-}
    container_name: zcrypt-bridge-watcher
    restart: unless-stopped
    depends_on:
      - cometbft
    command: ["bridge_watcher"]
    secrets:
      - reserve_key
    environment:
      ZC_URL: http://cometbft:26657
      ZCRYPT_RESERVE_KEY_FILE: /run/secrets/reserve_key
      # After a reserve-key ROTATION (`rotate_reserve`), keep the retired key(s) available
      # here (comma-separated 0600 files mounted as extra secrets) until every deposit and
      # redeem that names them has been swept/refunded; then drop them. Empty = none.
      ZCRYPT_RESERVE_PREV_KEY_FILES: ${ZCRYPT_RESERVE_PREV_KEY_FILES:-}
      WATCHER_STATE: /data/bridge-watcher-state.json
      # A FRESH watcher (no state file in the volume) starts scanning at this ZC height
      # instead of genesis. Ignored once the state file has a cursor.
      WATCHER_CURSOR_SEED: ${WATCHER_CURSOR_SEED:-}
      # A fresh watcher whose operator wallet already shows P2WSH (HTLC) sends is refused as
      # a probably LOST state file (it would fund every open redeem again). Set to 1 only
      # when that wallet history belongs to a previous, fully settled deployment.
      ZCRYPT_WATCHER_FRESH_STATE: ${ZCRYPT_WATCHER_FRESH_STATE:-0}
      WATCHER_POLL_SECS: ${WATCHER_POLL_SECS:-10}
      # ZCrypt blocks a redeem escrow must have left before the operator locks BTC.
      # Must exceed the BTC HTLC lock the watcher funds (3.5 days on mainnet) plus a claim
      # window; the daemon refuses to start with a value below its own floor.
      WATCHER_FINALIZE_MARGIN: ${WATCHER_FINALIZE_MARGIN:-475200}
      # Your OWN bitcoind for the operator wallet (the dev-profile regtest node is NOT
      # part of this profile; a production bridge never runs regtest).
      # All three are REQUIRED when the profile runs (the daemon exits if any is empty).
      BTC_URL: ${BTC_URL:-}
      BTC_USER: ${BTC_USER:-}
      BTC_PASS: ${BTC_PASS:-}
      BTC_NETWORK: ${BTC_NETWORK:-bitcoin}
      # The operator wallet must have RBF enabled (bitcoind -walletrbf=1, the default on
      # recent Core): stale redeem fundings are fee-bumped with `bumpfee`.
      BTC_WALLET: ${BTC_WALLET:-operator}
    volumes:
      - watcher-data:/data
    networks:
      - zcrypt-net

  # Regtest bitcoind: LOCAL demos only (profile dev). Bound to 127.0.0.1 on the host and
  # reachable inside the compose network; credentials come from .env, never defaults on a
  # public interface.
  bitcoind:
    profiles: ["dev"]
    image: ruimarinho/bitcoin-core:24
    container_name: zcrypt-bitcoind
    restart: unless-stopped
    command:
      - -regtest=1
      - -server=1
      - -txindex=1
      - -fallbackfee=0.0002
      - -rpcbind=0.0.0.0
      - -rpcallowip=172.16.0.0/12
      - -rpcallowip=10.0.0.0/8
      - -rpcallowip=192.168.0.0/16
      - -rpcuser=${BTC_USER:-zcrypt}
      - -rpcpassword=${BTC_PASS:-zcrypt}
      - -rpcport=18443
    ports:
      - "127.0.0.1:18443:18443"
    volumes:
      - bitcoind-data:/home/bitcoin/.bitcoin
    networks:
      - zcrypt-net

secrets:
  reserve_key:
    # 64 hex characters: the DERIVED 32-byte secp256k1 reserve key H("BTCBRDG", wallet seed),
    # optionally newline-terminated. (A file holding the wallet seed itself goes in
    # ZCRYPT_RESERVE_WALLET_SEED_FILE instead; the daemon then derives the key.)
    # Create with: umask 077; mkdir -p secrets; reserve_pubkey --wallet-seed-file <custody seed> --write-derived-key secrets/reserve.key
    file: ${ZCRYPT_RESERVE_KEY_PATH:-./secrets/reserve.key}

volumes:
  cometbft-data:
  abci-data:
  bitcoind-data:
  watcher-data:
  caddy-data:
  caddy-config:

networks:
  zcrypt-net:
    driver: bridge
