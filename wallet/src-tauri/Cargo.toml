[package]
name = "zcrypt-wallet"
version = "0.2.2"
edition = "2021"
license = "MIT"
description = "ZCrypt post-quantum wallet"

[lib]
name = "zcrypt_wallet_lib"
# staticlib: the iOS app links the wallet in; cdylib: Android; rlib: the desktop binary and tests.
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Devnet demo commands (off-chain mint_coins / send_coin for UI testing). OFF by default:
# they credit or spend coins without any transaction and must never ship in a real build.
devnet = []
# Measurement builds only: run the prover self-test once at startup and print it to stdout
# (`xcrun devicectl device process launch --console` shows it for a phone).
selftest-on-launch = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# `tauri::test::mock_app` lets the live 3-node test drive the real `#[tauri::command]`s
# with a genuine `State<AppState>`, no webview needed.
tauri = { version = "2", features = ["test"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
chacha20poly1305 = "0.10"
ureq = { version = "2", features = ["json", "socks-proxy"] }
base64 = "0.22"
zcrypt-core = { path = "../../impl/core", default-features = false }
zcrypt-shield = { path = "../../impl/shield" }
zcrypt-bridge = { path = "../../impl/bridge" }
bitcoin = "0.32"
rand = "0.8"
argon2 = "0.5"
ed25519-dalek = "2"   # sign validator BOND/DELEGATE txs
sha2 = "0.10"         # validator/delegator id = SHA256(pubkey)[..20]
zeroize = { version = "1", features = ["derive"] }   # wipe seeds / mnemonics / plaintext buffers on drop
libc = "0.2"          # getrusage for the prover self-test's peak memory
url = "2"             # strict node-URL policy (https or .onion for remote hosts) + loopback detection

# Dependency advisories tracked (no fix available short of upstream Tauri / Plonky3 bumps):
#   glib 0.18 (RUSTSEC-2024-0429, Linux only), gtk3 0.18 bindings (unmaintained), proc-macro-error 1.0.4
#   (RUSTSEC-2024-0370, build-time only), paste 1.0.15 (RUSTSEC-2024-0436, build-time macro via p3-*).
#   None is reachable from untrusted input in this wallet; re-check with `cargo audit` on each upgrade.

# zcrypt-shield (pulled via zcrypt-core) needs the patched p3-util + nightly
# (see ../rust-toolchain.toml).
[patch.crates-io]
p3-util = { path = "../../impl/vendor/p3-util" }

[profile.release]
opt-level = 3

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
tauri-plugin-biometric = "2"   # Face ID / Touch ID prompt, raised from Rust

[target.'cfg(target_os = "ios")'.dependencies]
security-framework = "3"       # Keychain item holding the device secret behind Face ID
security-framework-sys = "2"
# The native share sheet (UIActivityViewController) for .zcrypt files; same versions tauri uses.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL", "NSObject", "NSError"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "block2", "UIActivity", "UIActivityViewController", "UIViewController", "UIPopoverPresentationController", "UIPopoverSupport", "UIPresentationController", "UIView", "UIResponder", "UIDevice", "UIWindow", "UIWindowScene", "UIGeometry", "UIInterface"] }
