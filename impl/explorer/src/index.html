<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ZCrypt Explorer</title>
<meta name="theme-color" content="#06080f" />
<meta name="description" content="The ZCrypt block explorer: a public window onto the chain that reveals nothing private." />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2335e0ff'/%3E%3Cstop offset='1' stop-color='%236d7cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='11' fill='url(%23g)'/%3E%3Cpath d='M11 12h18L11 28h18' fill='none' stroke='%2304111a' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* Classic explorer layout (bordered cards, plain tables, search in the header) in the ZCrypt palette (brand/tokens.css). */
  :root {
    --bg: #06080f; --card: #0e121b; --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.16); --head: #0b0f18;
    --text: #f3f5f9; --body: #cfdae3; --muted: #9aa3b5; --faint: #5f687a;
    --link: #35e0ff; --link-bg: rgba(53,224,255,.12); --link-line: rgba(53,224,255,.3); --on-link: #04111a;
    --violet: #aab4ff; --violet-bg: rgba(109,124,255,.14); --violet-line: rgba(109,124,255,.4);
    --amber: #ffb547; --ok: #3ddc97; --ok-bg: rgba(61,220,151,.1); --bad: #ff5c6c; --bad-bg: rgba(255,92,108,.1); --state: #9aa3b5;
    --sans: "Inter Tight", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --r: 12px; --r-sm: 6px;
    --wrap: 1240px; --gutter: clamp(16px, 3vw, 32px);
  }
  * { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body { margin: 0; background: var(--bg); color: var(--body); font-family: var(--sans); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .mono { font-family: var(--mono); }
  .lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }

  /* --- header --- */
  header { background: var(--card); border-bottom: 1px solid var(--line); }
  .head { max-width: var(--wrap); margin: 0 auto; padding: 0 var(--gutter); height: 60px; display: flex; align-items: center; gap: 24px; }
  .brand { display: inline-flex; align-items: center; gap: 9px; color: var(--text); font-weight: 600; font-size: 1.05rem; white-space: nowrap; }
  .brand:hover { text-decoration: none; }
  .brand .tile { width: 26px; height: 26px; border-radius: 27.5%; background: var(--link); display: grid; place-items: center; flex: 0 0 auto; }
  .brand .tile svg { width: 16px; height: 16px; color: #04111a; }
  .brand .where { color: var(--muted); font-weight: 400; }
  .brand .where::before { content: "/"; color: var(--faint); margin: 0 6px 0 1px; }
  nav.top-nav { display: flex; gap: 20px; font-size: .9rem; font-weight: 500; }
  nav.top-nav a { color: var(--body); }
  nav.top-nav a:hover { color: var(--link); text-decoration: none; }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 16px; min-width: 0; flex: 1 1 auto; justify-content: flex-end; }
  .searchbar { display: flex; flex: 0 1 380px; min-width: 0; border: 1px solid var(--line-2); border-radius: 8px; background: var(--card); overflow: hidden; }
  .searchbar:focus-within { border-color: var(--link); box-shadow: 0 0 0 3px var(--link-bg); }
  .searchbar input { flex: 1; min-width: 0; background: none; border: 0; color: var(--text); padding: 8px 12px; font-family: inherit; font-size: .9rem; }
  .searchbar input::placeholder { color: var(--faint); }
  .searchbar input:focus { outline: none; }
  .searchbar button { background: var(--link); border: 0; color: var(--on-link); padding: 0 14px; font-size: .86rem; font-weight: 500; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .searchbar button:hover { background: #5be6ff; }
  .live { font-size: .8rem; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .live b { color: var(--text); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: 0 0 auto; }
  .dot.on { background: var(--ok); }

  .wrap { max-width: var(--wrap); margin: 0 auto; padding: 24px var(--gutter) 48px; }

  /* --- stat cards --- */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 18px; min-width: 0; }
  .stat .k { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  .stat .v { margin-top: 4px; font-size: 1.15rem; font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1.25; }
  .stat .v small { display: block; margin-top: 2px; font-size: .78rem; color: var(--muted); font-weight: 400; white-space: normal; }

  /* --- cards --- */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 20px; min-width: 0; }
  .card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; padding: 12px 18px; border-bottom: 1px solid var(--line); }
  .card-h h2 { margin: 0; font-size: 1rem; font-weight: 600; color: var(--text); }

  .tabs { display: flex; gap: 6px; }
  .tab { padding: 6px 12px; border-radius: 8px; color: var(--link); background: var(--link-bg); cursor: pointer; font-size: .84rem; font-weight: 500; white-space: nowrap; }
  .tab:hover { background: rgba(53,224,255,.2); }
  .tab.on { background: var(--link); color: var(--on-link); }

  .toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; white-space: nowrap; font-size: .86rem; color: var(--body); }
  .toggle input { position: absolute; opacity: 0; pointer-events: none; }
  .track { width: 36px; height: 20px; border-radius: 20px; background: rgba(255,255,255,.14); position: relative; flex: 0 0 auto; transition: background .15s; }
  .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.4); transition: transform .15s; }
  .toggle input:checked + .track { background: var(--link); }
  .toggle input:checked + .track::after { transform: translateX(16px); }
  .toggle input:focus-visible + .track { box-shadow: 0 0 0 3px var(--link-bg); }

  .scan-note { color: var(--muted); font-size: .82rem; padding: 10px 18px 0; }

  /* --- tables --- */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 560px; }
  th, td { text-align: left; padding: 11px 18px; border-bottom: 1px solid var(--line); font-size: .88rem; color: var(--body); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  th { color: var(--muted); font-weight: 600; font-size: .78rem; background: var(--head); white-space: nowrap; }
  td b { color: var(--text); font-weight: 600; }
  td.mono { font-family: var(--mono); font-size: .8rem; overflow-wrap: anywhere; }
  .num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  tbody tr.row { cursor: pointer; }
  tbody tr.row:hover { background: var(--head); }
  td.age { color: var(--muted); white-space: nowrap; }
  .h-types { display: flex; gap: 6px; flex-wrap: wrap; }

  .chip { display: inline-block; font-size: .74rem; padding: 2px 8px; border-radius: 6px; white-space: nowrap; line-height: 1.6; border: 1px solid var(--line-2); color: var(--muted); background: var(--card); }
  .chip.kind { color: var(--link); background: var(--link-bg); border-color: var(--link-line); }
  .chip.empty { color: var(--faint); background: var(--head); }
  .chip.hidden { color: var(--violet); background: var(--violet-bg); border-color: var(--violet-line); }
  .chip.hidden::before { content: "\1F512"; margin-right: 5px; font-size: .7rem; }

  /* --- tx detail --- */
  .tx { border: 1px solid var(--line); border-radius: var(--r); padding: 14px 18px 16px; margin-top: 14px; min-width: 0; }
  .tx-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
  .tx-type { font-weight: 600; font-size: 1rem; color: var(--text); }
  .tx-tag { font-family: var(--mono); font-size: .74rem; color: var(--muted); background: var(--head); border: 1px solid var(--line); padding: 1px 7px; border-radius: 6px; }
  .hidden-row { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-width: 0; }
  .hidden-row .lbl { margin-right: 4px; }

  .kv { margin-top: 10px; display: grid; grid-template-columns: minmax(120px, max-content) minmax(0,1fr); gap: 6px 20px; font-size: .86rem; align-items: baseline; }
  .kv .kk { color: var(--muted); min-width: 0; }
  .kv .vv { font-family: var(--mono); font-size: .8rem; overflow-wrap: anywhere; min-width: 0; color: var(--text); }

  .pub-grp { margin-top: 12px; padding: 10px 14px; background: var(--head); border-radius: var(--r-sm); min-width: 0; }
  .pub-grp .pg-title { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  .pub-grp .kv { margin-top: 4px; }
  .explains { margin-top: 12px; color: var(--muted); font-size: .86rem; max-width: 76ch; }

  /* --- validity rule / VM trace --- */
  .rules { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; min-width: 0; }
  .rules-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .rules-h .rt { color: var(--amber); font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .rules-h .rvm { color: var(--muted); font-size: .82rem; }
  .trace { margin-top: 10px; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; }
  .step { display: grid; grid-template-columns: 34px minmax(0,1fr); border-top: 1px solid var(--line); min-width: 0; }
  .step:first-child { border-top: none; }
  .step-n { text-align: center; padding: 8px 0; color: var(--faint); font-family: var(--mono); font-size: .72rem; background: var(--head); border-right: 1px solid var(--line); }
  .step-b { padding: 8px 12px; min-width: 0; }
  .step-head { display: flex; gap: 9px; align-items: baseline; flex-wrap: wrap; min-width: 0; }
  .op-hex { font-family: var(--mono); font-size: .72rem; color: var(--faint); flex: 0 0 auto; }
  .op-name { font-family: var(--mono); font-weight: 600; color: var(--amber); font-size: .78rem; flex: 0 0 auto; }
  .op-note { color: var(--muted); font-size: .84rem; flex: 1 1 200px; min-width: 0; }
  .op-val { margin-top: 4px; font-family: var(--mono); font-size: .75rem; color: var(--link); overflow-wrap: anywhere; line-height: 1.5; display: flex; gap: 6px; }
  .op-val .arr { color: var(--faint); flex: 0 0 auto; }
  .op-res { margin-top: 4px; font-size: .82rem; line-height: 1.5; display: flex; gap: 7px; min-width: 0; overflow-wrap: anywhere; }
  .op-res .mk { flex: 0 0 auto; font-weight: 600; }
  .op-res .rtxt { min-width: 0; }
  .op-res.res-ok { color: var(--ok); }
  .op-res.res-bad { color: var(--bad); }
  .op-res.res-state { color: var(--state); }
  .verdict { margin-top: 10px; font-size: .86rem; padding: 9px 12px; border-radius: var(--r-sm); font-weight: 500; overflow-wrap: anywhere; }
  .verdict.ok { color: var(--ok); background: var(--ok-bg); border: 1px solid rgba(61,220,151,.3); }
  .verdict.bad { color: var(--bad); background: var(--bad-bg); border: 1px solid rgba(255,92,108,.35); }
  .verdict.gate { color: var(--link); background: var(--link-bg); border: 1px solid var(--link-line); }
  .verdict .vt { color: var(--muted); font-weight: 400; }

  /* --- raw bytes + parse map --- */
  .raw { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; min-width: 0; }
  .raw-hex { margin-top: 8px; font-family: var(--mono); font-size: .72rem; line-height: 1.55; color: var(--muted); overflow-wrap: anywhere;
    max-height: 180px; overflow-y: auto; background: var(--head); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; }
  .raw-map { margin-top: 8px; display: grid; grid-template-columns: minmax(70px,auto) minmax(0,1.2fr) minmax(0,1fr); gap: 4px 12px; font-size: .82rem; min-width: 0; }
  .rm-range { font-family: var(--mono); color: var(--amber); font-size: .72rem; white-space: nowrap; }
  .rm-field { color: var(--muted); min-width: 0; }
  .rm-val { font-family: var(--mono); color: var(--text); font-size: .74rem; overflow-wrap: anywhere; min-width: 0; }
  @media (max-width: 560px) { .raw-map { grid-template-columns: minmax(0,1fr); gap: 2px; } .rm-val { margin-bottom: 8px; } }
  .prog-hex { margin-top: 10px; font-family: var(--mono); font-size: .72rem; color: var(--muted); overflow-wrap: anywhere; }
  .prog-hex .lab { color: var(--body); }
  .rules-why { margin-top: 10px; color: var(--muted); font-size: .82rem; line-height: 1.55; }

  /* --- assets --- */
  .asset-search { display: flex; align-items: center; gap: 12px; padding: 12px 18px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  .asset-search input { flex: 1 1 280px; min-width: 0; background: var(--card); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 12px; color: var(--text); font-size: .9rem; font-family: inherit; }
  .asset-search input:focus { outline: none; border-color: var(--link); box-shadow: 0 0 0 3px var(--link-bg); }
  .asset-count { color: var(--muted); font-size: .82rem; white-space: nowrap; }
  tr.hl-row { background: var(--link-bg); }

  /* --- validators --- */
  .val-stats { margin: 0; padding: 14px 18px; gap: 12px; border-bottom: 1px solid var(--line); }
  .val-stats .stat { background: var(--head); }
  #view-validators tbody tr { cursor: pointer; }
  #view-validators tbody tr:hover { background: var(--head); }
  .val-note { color: var(--muted); font-size: .82rem; padding: 10px 18px; }
  .uptime { display: inline-flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  .upbar { width: 56px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; flex: 0 0 auto; }
  .upbar i { display: block; height: 100%; background: var(--ok); }
  .upbar i.low { background: var(--amber); }
  .go { color: var(--faint); }

  .empty-note { color: var(--muted); padding: 28px 18px; font-size: .88rem; }
  .foot { padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: .8rem;
    display: flex; gap: 8px 24px; flex-wrap: wrap; justify-content: space-between; }
  .foot a { color: var(--muted); }
  .foot .mono { font-family: inherit; }

  /* --- modal --- */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(6,8,15,.75); z-index: 40; display: flex; align-items: flex-start; justify-content: center; padding: 32px 16px; }
  .modal { background: var(--card); border: 1px solid var(--line-2); border-radius: var(--r); width: 100%; max-width: 860px;
    max-height: calc(100vh - 64px); display: flex; flex-direction: column; min-width: 0; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .modal-h { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  #modal-title { font-weight: 600; color: var(--text); font-size: 1rem; min-width: 0; overflow-wrap: anywhere; }
  .modal-close { cursor: pointer; color: var(--muted); font-size: 1.5rem; line-height: 1; padding: 0 4px; flex: 0 0 auto; }
  .modal-close:hover { color: var(--text); }
  .modal-body { padding: 4px 18px 18px; overflow-y: auto; min-width: 0; }
  .modal .table-wrap { border: 1px solid var(--line); border-radius: var(--r-sm); margin-top: 12px; }
  .modal table { min-width: 0; }

  @media (max-width: 860px) { nav.top-nav { display: none; } .live { display: none; } .searchbar { flex-basis: 100%; } }
  @media (max-width: 560px) { .brand .where { display: none; } .head { height: auto; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; gap: 10px; } }
</style>
</head>
<body>
<header>
  <div class="head">
    <a class="brand" href="https://zcrypt.network" aria-label="ZCrypt home">
      <span class="tile"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M9 10h22L9 30h22" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span>ZCrypt</span><span class="where">Explorer</span>
    </a>
    <nav class="top-nav" aria-label="ZCrypt">
      <a href="https://zcrypt.network/#chapters">Why ZCrypt</a>
      <a href="https://zcrypt.network/docs/">Developers</a>
      <a href="https://zcrypt.network/#wallet">Wallet</a>
    </nav>
    <div class="top-right">
      <span class="live" id="live"><span class="dot" id="dot"></span><span id="live-txt">connecting…</span></span>
      <div class="searchbar">
        <input id="search" type="text" inputmode="numeric" placeholder="Search by block height" />
        <button id="search-go">Search</button>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="stats" id="stats"></div>

  <div class="card">
    <div class="card-h">
      <div class="tabs">
        <div class="tab on" data-tab="blocks">Blocks</div>
        <div class="tab" data-tab="assets">Assets</div>
        <div class="tab" data-tab="validators">Validators</div>
      </div>
      <label class="toggle" title="Hide heartbeat blocks with no transactions">
        <input type="checkbox" id="hide-empty" />
        <span class="track"></span>
        <span class="tlabel">Only blocks with transactions</span>
      </label>
    </div>

  <div class="scan-note" id="scan-note" style="display:none"></div>
  <div id="view-blocks"></div>
  <div id="view-assets" style="display:none">
    <div class="asset-search">
      <input id="asset-q" type="text" placeholder="Search assets by ticker or id…" autocomplete="off" spellcheck="false" />
      <span id="asset-count" class="asset-count"></span>
    </div>
    <div id="asset-list"></div>
  </div>
  <div id="view-validators" style="display:none"></div>
  </div>

  <div class="foot">
    <span>Read-only. The explorer sees what any node sees and nothing more.</span>
    <span class="mono"><a href="https://zcrypt.network">zcrypt.network</a> · <a href="https://github.com/echelonlabsresearch/ZCrypt">GitHub</a> · © Echelon Labs</span>
  </div>
</div>

<div class="modal-backdrop" id="modal" style="display:none">
  <div class="modal">
    <div class="modal-h"><span id="modal-title">Block</span><span class="modal-close" id="modal-close">&times;</span></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtAtomic = (n) => n == null ? "-" : (n / 1e6).toLocaleString(undefined, {maximumFractionDigits: 6});
const fmtCompact = (n) => n == null ? "-" : (n / 1e6).toLocaleString(undefined, {notation: "compact", maximumFractionDigits: 2});
async function get(p) { const r = await fetch(p); if (!r.ok) throw new Error(p); return r.json(); }

let hideEmpty = localStorage.getItem("zc-hide-empty") === "1";
let tick = 0;

function stat(k, v, sub, wrap) {
  return `<div class="stat${wrap ? " wrap" : ""}"><div class="k">${esc(k)}</div>` +
    `<div class="v">${v}${sub ? `<small>${esc(sub)}</small>` : ""}</div></div>`;
}

async function loadOverview() {
  try {
    const o = await get("/api/overview");
    $("#dot").classList.add("on");
    $("#live-txt").innerHTML = `<b>${esc(o.chain_id ?? "?")}</b> &middot; #${(o.height ?? 0).toLocaleString()}`;
    $("#stats").innerHTML =
      stat("Block height", (o.height ?? 0).toLocaleString()) +
      stat("Anonymity set", (o.commitments ?? 0).toLocaleString(), "coins in the pool") +
      stat("ZCRYPT issued", fmtCompact(o.supply_issued), "of 21M") +
      stat("Foundation", fmtCompact(o.foundation_vested),
           `vested of 4.2M · ${fmtCompact(o.foundation_claimed ?? 0)} claimed`) +
      stat("Validators", o.validators ?? 0) +
      stat("Shielded assets", o.assets ?? 0);
  } catch (e) { $("#dot").classList.remove("on"); $("#live-txt").textContent = "node unreachable"; }
}

// --- transaction rendering ---
function chips(arr, cls) { return arr.map(x => `<span class="chip ${cls}">${esc(x)}</span>`).join(""); }

function kvRows(obj, skip) {
  let rows = "";
  for (const [k, v] of Object.entries(obj)) {
    if (skip.includes(k) || v == null || typeof v === "object") continue;
    let val = v;
    if (k.endsWith("_atomic")) val = fmtAtomic(v);
    rows += `<div class="kk">${esc(k.replace(/_/g, " "))}</div><div class="vv">${esc(val)}</div>`;
  }
  return rows ? `<div class="kv">${rows}</div>` : "";
}

function pubGroup(title, obj) {
  return `<div class="pub-grp"><div class="pg-title">${esc(title)}</div>${kvRows(obj, [])}</div>`;
}

function opRow(o, i) {
  let extra = "";
  if (o.value != null) {
    const vals = Array.isArray(o.value) ? o.value : [o.value];
    extra += vals.map(v => `<div class="op-val"><span class="arr">&#8627;</span><span>${esc(v)}</span></div>`).join("");
  }
  if (o.result) {
    const ok = o.result.ok;
    const cls = ok === true ? "res-ok" : ok === false ? "res-bad" : "res-state";
    const mk = ok === true ? "&#10003;" : ok === false ? "&#10007;" : "&#8226;";
    extra += `<div class="op-res ${cls}"><span class="mk">${mk}</span><span class="rtxt">${esc(o.result.note)}</span></div>`;
  }
  return `<div class="step"><div class="step-n">${i}</div><div class="step-b">` +
    `<div class="step-head"><span class="op-hex">${esc(o.op)}</span>` +
    `<span class="op-name">${esc(o.name)}</span><span class="op-note">${esc(o.note)}</span></div>` +
    `${extra}</div></div>`;
}

function renderRules(r) {
  const ops = (r.program || []).map(opRow).join("");
  let verdict;
  if (r.circuit) {
    const ok = r.circuit.proof_verified;
    verdict = `<div class="verdict ${ok ? "ok" : "bad"}">circuit: explorer re-verified the STARK proof ${ok ? "&#10003;" : "FAILED"}` +
      (r.circuit.verify_ms != null ? ` <span class="vt">(${r.circuit.verify_ms} ms)</span>` : "") + `</div>`;
  } else if (r.reexecuted && r.reexecuted.ran > 0) {
    const ok = r.reexecuted.all_ok;
    verdict = `<div class="verdict ${ok ? "ok" : "bad"}">VM: explorer stepped through and re-executed ${r.reexecuted.ran} ` +
      `${r.reexecuted.ran === 1 ? "check" : "checks"} ${ok ? "&rarr; all match consensus &#10003;" : "&rarr; MISMATCH"}</div>`;
  } else {
    verdict = `<div class="verdict gate">this bytecode is the consensus gate that admitted the tx</div>`;
  }
  const why = r.equivalence || [r.reexecuted && r.reexecuted.detail, r.gate].filter(Boolean).join(" ");
  return `<div class="rules"><div class="rules-h"><span class="rt">validity rule</span>` +
    `<span class="rvm">${esc(r.vm || "")}</span></div>` +
    `<div class="trace">${ops}</div>${verdict}` +
    (r.program_hex ? `<div class="prog-hex"><span class="lab">bytecode:</span> ${esc(r.program_hex)}</div>` : "") +
    (why ? `<div class="rules-why">${esc(why)}</div>` : "") + `</div>`;
}

// The full transaction bytes + the byte map consensus parses them by (the VM's
// register loads). Rendered above the program so the reading order is:
// raw bytes -> parsed fields -> bytecode stepped over them.
function renderRaw(r) {
  let h = `<div class="raw"><div class="rules-h"><span class="rt">raw transaction</span>` +
    `<span class="rvm">${(r.total_bytes ?? 0).toLocaleString()} bytes on chain</span></div>`;
  if (r.tx_hex) h += `<div class="raw-hex">${esc(r.tx_hex)}</div>`;
  else if (r.head_hex) h += `<div class="raw-hex">${esc(r.head_hex)}</div>`;
  if (Array.isArray(r.layout) && r.layout.length) {
    h += `<div class="raw-map">` + r.layout.map(x =>
      `<div class="rm-range">${esc(x.range)}</div>` +
      `<div class="rm-field">${esc(x.field)}</div>` +
      `<div class="rm-val">${esc(x.value)}</div>`).join("") + `</div>`;
    h += `<div class="rules-why">Every byte above is public input: the node parses these exact ranges \
into the VM's registers before the validity program below runs. Nothing else about the transaction \
exists on chain.</div>`;
  }
  return h + `</div>`;
}

function renderTx(t) {
  let h = `<div class="tx"><div class="tx-top"><span class="tx-type">${esc(t.type ?? "tx")}</span>` +
          `<span class="tx-tag">${esc(t.tag ?? "")}</span></div>`;
  if (Array.isArray(t.hidden) && t.hidden.length)
    h += `<div class="hidden-row"><span class="lbl">protected:</span>${chips(t.hidden, "hidden")}</div>`;
  h += kvRows(t, ["type", "tag", "hidden", "public", "explains", "note", "rules", "raw"]);
  if (t.public && typeof t.public === "object" && !Array.isArray(t.public))
    for (const [name, grp] of Object.entries(t.public))
      if (grp && typeof grp === "object") h += pubGroup(name.replace(/_/g, " "), grp);
  if (Array.isArray(t.public))
    h += `<div class="pub-grp"><div class="pg-title">public</div>${kvRows(Object.fromEntries(t.public.map((x,i)=>[i,x])), [])}</div>`;
  if (t.explains) h += `<div class="explains">${esc(t.explains)}</div>`;
  if (t.note) h += `<div class="explains">${esc(t.note)}</div>`;
  if (t.raw) h += renderRaw(t.raw);
  if (t.rules) h += renderRules(t.rules);
  return h + `</div>`;
}

// Open a block's transactions in a pinned MODAL — it lives outside the auto-refreshing list,
// so the details stay put no matter how fast the chain advances.
async function openBlockModal(height) {
  const body = $("#modal-body");
  $("#modal-title").textContent = `Block #${height}`;
  body.innerHTML = `<div class="empty-note">loading…</div>`;
  $("#modal").style.display = "flex";
  try {
    const b = await get(`/api/block/${height}`);
    const t = b.time ? new Date(b.time).toLocaleString() : "";
    $("#modal-title").textContent = `Block #${b.height}  ·  ${b.num_txs} tx  ·  ${t}`;
    body.innerHTML = b.txs.length
      ? b.txs.map(renderTx).join("")
      : `<div class="empty-note">Empty block — a consensus heartbeat with no transactions.</div>`;
    body.scrollTop = 0;
  } catch (e) { body.innerHTML = `<div class="empty-note">block #${esc(height)} not found</div>`; }
}
function closeModal() { $("#modal").style.display = "none"; }

function doSearch() {
  const h = parseInt(($("#search").value || "").trim(), 10);
  if (Number.isFinite(h) && h > 0) openBlockModal(h);
}
$("#search-go").onclick = doSearch;
$("#search").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
$("#modal-close").onclick = closeModal;
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

function ago(iso) {
  if (!iso) return "";
  const d = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (d < 60) return `${Math.floor(d)} secs ago`;
  if (d < 3600) { const m = Math.floor(d / 60); return `${m} min${m === 1 ? "" : "s"} ago`; }
  if (d < 86400) { const h = Math.floor(d / 3600); return `${h} hr${h === 1 ? "" : "s"} ago`; }
  const dd = Math.floor(d / 86400); return `${dd} day${dd === 1 ? "" : "s"} ago`;
}

function blockRow(b) {
  const types = b.num_txs
    ? `<div class="h-types">${chips([...new Set(b.types)], "kind")}</div>`
    : `<span class="chip empty">none</span>`;
  const t = b.time ? new Date(b.time).toLocaleString() : "";
  return `<tr class="row" onclick="openBlockModal(${b.height})">` +
         `<td><a href="#" onclick="event.preventDefault()">${b.height}</a></td>` +
         `<td class="age" title="${esc(t)}">${ago(b.time)}</td>` +
         `<td class="num">${b.num_txs}</td>` +
         `<td>${types}</td>` +
         `<td class="num"><span class="go">&rsaquo;</span></td></tr>`;
}

const blockTable = (rows) =>
  `<div class="table-wrap"><table><thead><tr><th>Block</th><th>Age</th><th class="num">Txs</th><th>Transactions</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;

async function loadBlocks() {
  const note = $("#scan-note");
  try {
    const url = hideEmpty ? "/api/blocks?count=40&nonempty=1" : "/api/blocks?count=40";
    const res = await get(url);
    const bs = res.blocks || [];
    const onBlocks = document.querySelector(".tab.on")?.dataset.tab === "blocks";
    if (hideEmpty && onBlocks) {
      note.style.display = "block";
      if (!bs.length) note.textContent = res.reached_floor
        ? `No transactions found scanning back to block ${res.scanned_to}.`
        : `No blocks with transactions yet.`;
      else note.textContent = `Showing ${bs.length} block${bs.length===1?"":"s"} with transactions` +
        (res.reached_floor ? `, scanning back to #${res.scanned_to} (older blocks lie beyond the scan window).`
                           : ` (heartbeat blocks hidden).`);
    } else {
      note.style.display = "none";
    }
    $("#view-blocks").innerHTML = bs.length ? blockTable(bs.map(blockRow).join("")) : `<div class="empty-note">no blocks yet</div>`;
  } catch (e) { note.style.display = "none"; $("#view-blocks").innerHTML = `<div class="empty-note">node unreachable</div>`; }
}

// Minted supply in whole units of the asset's own decimals (e.g. 3,000,000,000 atomic
// at 8 dp → "30 zBTC"), with the raw atomic count on hover. Falls back to raw atomic
// when a node is too old to report decimals.
function fmtMinted(minted, decimals, ticker) {
  const raw = minted ?? 0;
  const t = ticker ? " " + esc(ticker) : "";
  if (decimals == null) return `<span title="raw atomic units">${raw.toLocaleString()}${t}</span>`;
  const whole = raw / Math.pow(10, decimals);
  const shown = whole.toLocaleString(undefined, { maximumFractionDigits: decimals });
  return `<span title="${raw.toLocaleString()} atomic units">${shown}${t}</span>`;
}

// All assets are held client-side so search is instant and offline-of-the-node — the
// registry is small per request but may hold thousands of entries, so we filter locally
// rather than round-trip the node on every keystroke.
let allAssets = [];

function renderAssets() {
  const box = $("#asset-list");
  const count = $("#asset-count");
  if (!allAssets.length) {
    box.innerHTML = `<div class="empty-note">no shielded assets registered yet</div>`;
    count.textContent = "";
    return;
  }
  const q = ($("#asset-q").value || "").trim().toLowerCase();
  const shown = q
    ? allAssets.filter(x => (x.ticker || "").toLowerCase().includes(q) || String(x.asset_id).includes(q))
    : allAssets;
  count.textContent = q
    ? `${shown.length} of ${allAssets.length} asset${allAssets.length === 1 ? "" : "s"}`
    : `${allAssets.length} asset${allAssets.length === 1 ? "" : "s"}`;
  box.innerHTML = shown.length
    ? `<div class="table-wrap"><table><thead><tr><th>Ticker</th><th>Asset ID</th><th class="num">Minted supply</th></tr></thead><tbody>` +
      shown.map(x => `<tr><td><b>${esc(x.ticker)}</b></td><td class="mono">${esc(x.asset_id)}</td>` +
        `<td class="num">${fmtMinted(x.minted, x.decimals, x.ticker)}</td></tr>`).join("") +
      `</tbody></table></div>`
    : `<div class="empty-note">no asset matches “${esc(q)}”</div>`;
}

async function loadAssets() {
  try {
    allAssets = await get("/api/assets");
    renderAssets();
  } catch (e) { $("#asset-list").innerHTML = `<div class="empty-note">unreachable</div>`; $("#asset-count").textContent = ""; }
}
$("#asset-q").addEventListener("input", renderAssets);

// --- validators ---
let valCtx = null; // last /api/validators payload; the detail modal reads from it

const shortHex = (h) => h && h.length > 20 ? `${h.slice(0, 10)}…${h.slice(-6)}` : (h || "-");
const valPower = (v) => (v.power ?? v.stake ?? 0);
const valWeight = (v) => valPower(v) * (v.signed_this_epoch ?? 0);

function uptimeCell(v, prog) {
  if (!prog) return `<span class="uptime" title="epoch just started">–</span>`;
  const pct = Math.min(100, Math.round(100 * (v.signed_this_epoch ?? 0) / prog));
  return `<span class="uptime"><span class="upbar"><i class="${pct < 90 ? "low" : ""}" style="width:${pct}%"></i></span>${pct}%</span>`;
}

function loadValidatorsInto(d) {
  valCtx = d;
  const vs = d.validators || [];
  if (!vs.length) { $("#view-validators").innerHTML = `<div class="empty-note">no bonded validators</div>`; return; }
  if (d.legacy) {
    // Old node: only "<pubkey>:<stake>" is available.
    $("#view-validators").innerHTML =
      `<div class="table-wrap"><table><thead><tr><th>Validator</th><th class="num">Stake (ZCRYPT)</th></tr></thead><tbody>` +
      vs.map(x => `<tr><td class="mono">${esc(x.id)}</td><td class="num">${fmtAtomic(x.stake)}</td></tr>`).join("") +
      `</tbody></table></div>` +
      `<div class="val-note">This node predates the validator-detail API; rewards data is unavailable.</div>`;
    return;
  }
  const totalPower = vs.reduce((a, x) => a + valPower(x), 0);
  const prog = d.epoch_progress ?? 0;
  const ctx =
    `<div class="stats val-stats">` +
    stat("Total staked", fmtCompact(d.total_staked), "ZCRYPT bonded + delegated") +
    stat("Unbonding", fmtCompact(d.total_unbonding), "locked 10 days") +
    stat("Epoch reward", fmtAtomic(d.epoch_reward), `ZCRYPT every ${d.epoch_blocks} blocks`) +
    stat("Epoch progress", `${prog} / ${d.epoch_blocks}`, "blocks into this epoch") +
    stat("Commission", `${d.commission_percent}%`, "on delegated rewards") +
    `</div>`;
  const rows = vs.map((v, i) =>
    `<tr onclick="openValidatorModal(${i})">` +
    `<td class="mono" title="${esc(v.id)}">${esc(shortHex(v.id))}</td>` +
    `<td class="num">${fmtAtomic(v.stake)}</td>` +
    `<td class="num">${fmtAtomic(v.delegated)}</td>` +
    `<td class="num">${totalPower ? (100 * valPower(v) / totalPower).toFixed(1) : "0.0"}%</td>` +
    `<td>${uptimeCell(v, prog)}</td>` +
    `<td class="num">${fmtAtomic(v.earned)}</td>` +
    `<td class="num">${fmtAtomic(v.unclaimed)}</td>` +
    `<td><span class="go">&rsaquo;</span></td></tr>`).join("");
  $("#view-validators").innerHTML = ctx +
    `<div class="table-wrap"><table><thead><tr>` +
    `<th>Validator</th><th class="num">Self-stake</th><th class="num">Delegated</th>` +
    `<th class="num">Power</th><th>Uptime</th>` +
    `<th class="num" title="Lifetime block rewards credited to this validator's reward address">Rewards earned</th>` +
    `<th class="num" title="Accrued but not yet claimed into spendable coins (includes returned unbonded stake)">Unclaimed</th>` +
    `<th></th></tr></thead><tbody>${rows}</tbody></table></div>` +
    `<div class="val-note">All amounts in ZCRYPT. Click a validator for its full profile: rewards, delegations, participation.</div>`;
}

async function loadValidators() {
  try { loadValidatorsInto(await get("/api/validators")); }
  catch (e) { $("#view-validators").innerHTML = `<div class="empty-note">unreachable</div>`; }
}

// Per-asset bridge-fee earnings, mapped through the asset registry when it is
// already loaded (ticker + decimals), raw atomic otherwise.
function feeEarnedRows(fees) {
  return (fees || []).map(f => {
    const a = allAssets.find(x => String(x.asset_id) === String(f.asset_id));
    const shown = a ? fmtMinted(f.amount, a.decimals, a.ticker) : `${(f.amount ?? 0).toLocaleString()} atomic · asset #${esc(f.asset_id)}`;
    return `<div class="kk">bridge fees</div><div class="vv">${shown}</div>`;
  }).join("");
}

function openValidatorModal(i) {
  const d = valCtx; if (!d || d.legacy) return;
  const v = (d.validators || [])[i]; if (!v) return;
  if (!allAssets.length) loadAssets(); // best-effort ticker mapping for fee earnings
  const vs = d.validators || [];
  const totalPower = vs.reduce((a, x) => a + valPower(x), 0);
  const totalWeight = vs.reduce((a, x) => a + valWeight(x), 0);
  const estNext = totalWeight ? Math.floor((d.epoch_reward ?? 0) * valWeight(v) / totalWeight) : 0;
  const prog = d.epoch_progress ?? 0;
  $("#modal-title").textContent = `Validator ${shortHex(v.id)}`;
  let h = `<div class="tx"><div class="tx-top"><span class="tx-type">Rewards</span></div><div class="kv">` +
    `<div class="kk">lifetime earned</div><div class="vv">${fmtAtomic(v.earned)} ZCRYPT</div>` +
    `<div class="kk">unclaimed</div><div class="vv">${fmtAtomic(v.unclaimed)} ZCRYPT</div>` +
    `<div class="kk">est. next epoch</div><div class="vv">${fmtAtomic(estNext)} ZCRYPT</div>` +
    feeEarnedRows(v.fee_earned) + `</div>` +
    `<div class="explains">Lifetime earned counts every block reward ever credited to this validator's reward
address (claiming does not reduce it). Unclaimed is what is still sitting on the ledger, and also receives
returned stake after unbonding. The next-epoch estimate assumes participation stays as it is now.</div></div>`;
  h += `<div class="tx"><div class="tx-top"><span class="tx-type">Stake &amp; participation</span></div><div class="kv">` +
    `<div class="kk">self-stake</div><div class="vv">${fmtAtomic(v.stake)} ZCRYPT</div>` +
    `<div class="kk">delegated</div><div class="vv">${fmtAtomic(v.delegated)} ZCRYPT</div>` +
    `<div class="kk">voting power</div><div class="vv">${fmtAtomic(valPower(v))} ZCRYPT` +
    ` (${totalPower ? (100 * valPower(v) / totalPower).toFixed(2) : "0"}% of the network)</div>` +
    `<div class="kk">signed this epoch</div><div class="vv">${v.signed_this_epoch ?? 0} of ${prog} block${prog === 1 ? "" : "s"}</div>` +
    `<div class="kk">commission</div><div class="vv">${d.commission_percent}% on delegated rewards</div>` +
    `</div></div>`;
  h += `<div class="tx"><div class="tx-top"><span class="tx-type">Identity</span></div><div class="kv">` +
    `<div class="kk">validator id</div><div class="vv">${esc(v.id)}</div>` +
    `<div class="kk">consensus pubkey</div><div class="vv">${esc(v.consensus_pubkey)}</div>` +
    `<div class="kk">reward address</div><div class="vv">${esc(v.reward_address)}</div>` +
    `</div></div>`;
  if ((v.delegations || []).length) {
    h += `<div class="tx"><div class="tx-top"><span class="tx-type">Delegations</span>` +
      `<span class="tx-tag">${v.delegations.length}</span></div>` +
      `<div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Delegator</th><th class="num">Stake (ZCRYPT)</th></tr></thead><tbody>` +
      v.delegations.map(x => `<tr><td class="mono">${esc(x.delegator)}</td><td class="num">${fmtAtomic(x.stake)}</td></tr>`).join("") +
      `</tbody></table></div></div>`;
  }
  if ((v.unbonding || []).length) {
    h += `<div class="tx"><div class="tx-top"><span class="tx-type">Unbonding</span></div>` +
      `<div class="table-wrap" style="margin-top:12px"><table><thead><tr><th class="num">Stake (ZCRYPT)</th><th>Releases</th></tr></thead><tbody>` +
      v.unbonding.map(x => `<tr><td class="num">${fmtAtomic(x.stake)}</td>` +
        `<td>${new Date((x.release_time ?? 0) * 1000).toLocaleString()}</td></tr>`).join("") +
      `</tbody></table></div></div>`;
  }
  $("#modal-body").innerHTML = h;
  $("#modal-body").scrollTop = 0;
  $("#modal").style.display = "flex";
}

document.querySelectorAll(".tab").forEach(tab => tab.onclick = () => {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("on"));
  tab.classList.add("on");
  for (const v of ["blocks", "assets", "validators"])
    $("#view-" + v).style.display = v === tab.dataset.tab ? "block" : "none";
  $("#scan-note").style.display = (tab.dataset.tab === "blocks" && hideEmpty) ? "block" : "none";
  document.querySelector(".toggle").style.display = tab.dataset.tab === "blocks" ? "" : "none";
  if (tab.dataset.tab === "assets") loadAssets();
  if (tab.dataset.tab === "validators") loadValidators();
});

const chk = $("#hide-empty");
chk.checked = hideEmpty;
chk.addEventListener("change", () => {
  hideEmpty = chk.checked;
  localStorage.setItem("zc-hide-empty", hideEmpty ? "1" : "0");
  loadBlocks();
});

loadOverview(); loadBlocks();
// Overview refreshes every 5s. The block list refreshes with it when showing all blocks; when
// filtered to non-empty (a backward scan), it refreshes less often to keep the scan cheap.
setInterval(() => {
  tick++;
  loadOverview();
  if (!hideEmpty || tick % 4 === 0) loadBlocks();
  // Keep the validator table (uptime, rewards) fresh while it's on screen; the
  // pinned detail modal is left alone so it never shifts under the reader.
  if ($("#view-validators").style.display !== "none" && tick % 2 === 0) loadValidators();
}, 5000);
</script>
</body>
</html>
