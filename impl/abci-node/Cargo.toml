[package]
name = "zcrypt-abci-node"
version.workspace = true
edition.workspace = true

[[bin]]
name = "zcrypt-abci-node"
path = "src/main.rs"

[features]
# OFF by default. Enables the permissionless SEED tx (0x56), which appends an
# unbacked commitment to the tree — an "infinite money" primitive that must NEVER
# be reachable on a value-bearing network. Build devnets with `--features devnet`.
devnet = []
# Thicker FRI soundness margin (propagates to zcrypt-shield).
high-security = ["zcrypt-core/high-security"]

[dependencies]
zcrypt-core = { path = "../core" }
serde_json.workspace = true
hex.workspace = true
tendermint-abci = "0.40.4"
tendermint-proto = "0.40"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2.workspace = true
