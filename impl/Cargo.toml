[workspace]
resolver = "2"
members = ["core", "cli", "abci-node", "shield", "bridge", "explorer"]

# Plonky3's published p3-util (0.6.1) uses an unstable API without declaring the
# feature gate; vendored copy adds `#![feature(maybe_uninit_slice)]`. Requires
# the nightly toolchain pinned in rust-toolchain.toml.
[patch.crates-io]
p3-util = { path = "vendor/p3-util" }

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"

# Tests generate STARK proofs (proving, not just verifying) — at opt-level 0 a
# single shield proof takes minutes. Optimize the crates under test and all
# dependencies (Plonky3, the shield prover) so the e2e suites run in minutes,
# not hours; workspace compile times stay tolerable.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
sha3 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
chacha20poly1305 = "0.10"
ml-kem = { version = "0.2", features = ["deterministic"] }
kem = "=0.3.0-pre.0"
bip39 = "2.2"
bech32 = "0.11"
rand = "0.8"
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
