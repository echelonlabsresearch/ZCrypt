# Pinned by DATE so every validator, CI runner, and Docker image compiles the same
# compiler (an unpinned "nightly" drifts daily and makes the consensus binary
# non-reproducible). Bump deliberately, in one commit, together with
# chain/docker/Dockerfile (RUST_NIGHTLY) and wallet/rust-toolchain.toml, and re-run CI
# on testnet before merging to main.
[toolchain]
channel = "nightly-2026-11-07"
components = ["rustfmt", "clippy"]
profile = "minimal"
