[package]
name = "zcrypt-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bitcoin = { version = "0.32", features = ["rand-std"] }
bip39 = { version = "2", features = ["zeroize"] }   # wipe mnemonics on drop
rand = { workspace = true }
bitcoincore-rpc = "0.19"
ureq = { version = "2", features = ["json", "socks-proxy"] }
base64 = "0.22"
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = "2"
sha2 = { workspace = true }
zcrypt-core = { path = "../core", default-features = false }
zcrypt-shield = { path = "../shield" }
url = "2"                                        # strict loopback detection for the Tor bypass
zeroize = { version = "1", features = ["derive"] }   # wipe BIP-39 seeds and HTLC keys
