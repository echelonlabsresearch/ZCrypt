# Publish the ABCI image, signed with cosign (keyless, GitHub OIDC).
# A joining validator does not pull it. chain/validator/docker-compose.yml builds
# the checkout; its .env is only VALIDATOR_KEY.
#
# Runs on release tags (v*), on the testnet and mainnet branches when the node or
# image definition changes, and on demand. The image is the production ABCI
# binary (no devnet features). The testnet branch tags :testnet, which is mainnet
# code that has not shipped yet. The mainnet branch tags :mainnet. A v* tag also
# publishes an immutable digest. The Dockerfile uses a date-pinned nightly and --locked.
name: Publish ABCI image

on:
  push:
    tags: ["v*"]
    branches: ["testnet", "mainnet"]
    paths:
      - "impl/**"
      - "chain/docker/**"
      - "chain/validator/docker-compose.yml"
      - ".github/workflows/image.yml"
  workflow_dispatch:
    inputs:
      abci_features:
        description: "Cargo features for zcrypt-abci-node (EMPTY for production; never devnet for mainnet)"
        required: false
        default: ""

env:
  # Change the owner here if the image lives under the zcryptnetwork org
  # rather than the repository owner.
  IMAGE: ghcr.io/${{ github.repository_owner }}/zcrypt-abci

permissions:
  contents: read
  packages: write
  id-token: write   # cosign keyless signing (Sigstore Fulcio via GitHub OIDC)

jobs:
  build-sign:
    name: Build, push, sign
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: chain/docker/Dockerfile
          push: true
          provenance: true
          sbom: true
          build-args: |
            ABCI_FEATURES=${{ github.event.inputs.abci_features }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image digest (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Verify our own signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            id_re="^https://github.com/${{ github.repository }}/\\.github/workflows/image\\.yml@refs/tags/v"
          else
            id_re="^https://github.com/${{ github.repository }}/\\.github/workflows/image\\.yml@${{ github.ref }}$"
          fi
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "$id_re" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Make the package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GHCR packages are private by default, so a fresh validator cannot pull
          # them. A public repo's package should be public. Do not fail the publish
          # if GitHub has not finished registering the package yet.
          if gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${{ github.repository_owner }}/packages/container/zcrypt-abci" \
            -f visibility=public; then
            echo "package is public"
          else
            echo "could not mark ghcr.io/${{ github.repository_owner }}/zcrypt-abci public. Set the package to public in GitHub or pulls will return 403."
          fi
      - name: Publish the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## ABCI image"
            echo
            echo "Pin this in \`chain/docker-compose.validator.yml\`:"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Verify: \`cosign verify ${IMAGE}@${DIGEST} --certificate-identity-regexp '^https://github.com/${{ github.repository }}/\\.github/workflows/image\\.yml@refs/tags/v' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`"
          } >> "$GITHUB_STEP_SUMMARY"
