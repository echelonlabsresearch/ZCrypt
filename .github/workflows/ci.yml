# One test workflow.
#
# Every push and pull request runs the fast jobs, each inside a 7 GB / 14 GB-disk runner:
#   * three test shards that together cover the whole impl workspace (unit + integration,
#     including real STARK proofs); the earlier single job ran the linker out of memory;
#   * clippy with a RATCHET: the lint classes present today are allowed explicitly, any
#     new class fails the build (tighten the list as classes are cleaned up);
#   * supply chain: cargo audit, cargo deny (advisories, licenses, sources, bans) on both
#     lockfiles, npm audit on the wallet frontend;
#   * the wallet frontend build + backend tests;
#   * the Lean proofs in formal/: every proof is machine-checked again, and an axiom audit
#     fails the build on an unfinished proof or a new axiom.
# A newer push to the same branch or pull request cancels the run it replaces. Runs on
# mainnet and the nightly are never cancelled.
# The live 3-node job is in this same workflow. It builds Docker images and real STARK
# proofs, so it runs on a push to testnet or mainnet, on a pull request into either
# branch, nightly at 06:00 UTC, or when someone starts the workflow by hand. A pull
# request into testnet is where new code is tested. A pull request into mainnet must
# come from that branch; the gate job fails any other head.
# A release takes the same files through three events: the push to testnet, the pull
# request into mainnet, and the merge. The live job runs in full on the first. On the
# others it looks for a full, successful run of itself on a commit with exactly the same
# tree, made in the last seven days, and if there is one it reports that run and stops.
# The nightly and manual runs always execute in full, which is what catches a change
# outside the repository (a base image, a package).
# Every cargo invocation is --locked: Cargo.lock is authoritative. Actions are pinned by
# commit SHA (the tag is in the comment) so a moved tag cannot change what runs.
# Publishing the ABCI image is not a test; that stays in image.yml.
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * *'   # nightly at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.ref != 'refs/heads/mainnet' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Debug info is what blew the linker past the runner's memory; tests do not need it.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  # Two parallel rustc/link jobs keep peak memory under the 7 GB hosted-runner ceiling.
  CARGO_BUILD_JOBS: "2"
  RUST_BACKTRACE: "1"
  # ubuntu-latest is Ubuntu 26.04 since 2026-11; its GCC no longer includes <cstdint>
  # transitively, and the vendored RocksDB 8.10 in librocksdb-sys 0.16 relies on that
  # (uint64_t undeclared). Pre-including it is the upstream-recommended workaround until
  # the rocksdb crate is bumped to a RocksDB that carries the fix.
  CXXFLAGS: "-include cstdint"
  # Baseline of clippy classes present in the tree today (see the clippy job).
  CLIPPY_BASELINE: >-
    -A clippy::cloned_ref_to_slice_refs -A clippy::needless_range_loop
    -A clippy::type_complexity -A clippy::clone_on_copy -A clippy::manual_is_multiple_of
    -A clippy::too_many_arguments -A dead_code -A clippy::redundant_guards
    -A clippy::unnecessary_cast -A clippy::doc_overindented_list_items
    -A clippy::manual_div_ceil -A clippy::int_plus_one -A clippy::unused_enumerate_index
    -A clippy::manual_range_contains -A clippy::new_without_default
    -A clippy::len_without_is_empty -A clippy::while_let_on_iterator
    -A clippy::needless_borrows_for_generic_args -A unused_mut -A clippy::map_identity
    -A clippy::assertions_on_constants -A clippy::useless_format
    -A clippy::doc_lazy_continuation -A clippy::single_match -A unused_parens
    -A clippy::redundant_static_lifetimes -A clippy::nonminimal_bool
    -A clippy::redundant_locals

jobs:
  rust-tests:
    name: Rust tests (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: shield + core unit
            key: unit
            cmd: cargo test --locked -p zcrypt-shield -p zcrypt-core --lib
          # --test '*' is the integration tests only: the core unit tests already ran in
          # the shard above.
          - name: core integration + abci
            key: integration
            cmd: >-
              cargo test --locked -p zcrypt-core --test '*' --examples &&
              cargo test --locked -p zcrypt-abci-node &&
              cargo test --locked -p zcrypt-abci-node --features devnet
          - name: bridge + explorer + cli
            key: bridge
            cmd: cargo test --locked -p zcrypt-bridge -p zcrypt-explorer -p zcrypt-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - name: Native build deps (RocksDB via bindgen)
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends clang libclang-dev cmake pkg-config
      # rust-toolchain.toml pins the dated nightly; rustup installs it on first cargo call.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: impl
          # One cache per shard. The shards build different dependency sets (only two of
          # them build RocksDB, about eight minutes of C++), and a shared key keeps only
          # the first shard's.
          shared-key: impl-tests-${{ matrix.shard.key }}
      - name: Show toolchain
        working-directory: impl
        run: rustup show
      - name: ${{ matrix.shard.name }}
        working-directory: impl
        run: ${{ matrix.shard.cmd }}

  clippy:
    name: Clippy ratchet (impl + wallet)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Native build deps
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends clang libclang-dev cmake pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            impl
            wallet/src-tauri
          shared-key: clippy
      - name: Clippy (impl workspace)
        working-directory: impl
        run: cargo clippy --workspace --all-targets --locked -- -D warnings $CLIPPY_BASELINE
      - name: Clippy (wallet backend)
        working-directory: wallet/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings $CLIPPY_BASELINE

  supply-chain:
    name: Supply chain (audit, deny, npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-audit + cargo-deny (prebuilt)
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit (impl)
        working-directory: impl
        # Vulnerabilities fail the job; unmaintained/yanked notices are reported by cargo deny
        # with per-advisory reasons in deny.toml, so they are informational here.
        run: cargo audit --deny unsound --deny yanked --ignore RUSTSEC-2023-0089 --ignore RUSTSEC-2024-0436
      - name: cargo audit (wallet)
        working-directory: wallet/src-tauri
        run: cargo audit
      - name: cargo deny (impl)
        working-directory: impl
        run: cargo deny --config ../deny.toml --locked check
      - name: cargo deny (wallet)
        working-directory: wallet/src-tauri
        run: cargo deny --config ../../deny.toml --locked check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: npm audit (wallet frontend)
        working-directory: wallet
        # A high or critical advisory fails the job unless it is listed here with a reason,
        # the same way deny.toml lists the cargo ones. Remove an entry once a fixed release
        # exists.
        #   GHSA-fc5q-39xc-vjpf: picomatch ReDoS on a crafted glob. No fixed release yet
        #   (every version up to 4.0.7 is affected). It is a build-time dependency of Vite,
        #   which only globs this repository's own files, and it is not in the shipped app.
        #   The other way out, Vite 6.2, brings back the dev-server file-read advisories.
        env:
          NPM_AUDIT_IGNORE: GHSA-fc5q-39xc-vjpf
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e '
            const report = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if (!report.vulnerabilities) { console.error("npm audit gave no report"); process.exit(1); }
            const ignore = new Set((process.env.NPM_AUDIT_IGNORE || "").split(/[\s,]+/).filter(Boolean));
            const found = new Map();
            for (const v of Object.values(report.vulnerabilities))
              for (const a of v.via)
                if (typeof a === "object" && ["high", "critical"].includes(a.severity))
                  found.set(a.url.split("/").pop(), `${a.severity}: ${a.name} ${a.range}: ${a.title}`);
            let bad = 0;
            for (const [id, line] of found) {
              const skip = ignore.has(id);
              console.log(`${skip ? "ignored" : "FAIL   "} ${id} ${line}`);
              if (!skip) bad++;
            }
            for (const id of ignore) if (!found.has(id)) console.log(`stale ignore entry: ${id} is no longer reported, remove it`);
            process.exit(bad ? 1 : 0);
          ' "$RUNNER_TEMP/npm-audit.json"

  wallet:
    name: Wallet (frontend build + backend test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Tauri system dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev clang libclang-dev cmake pkg-config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: wallet/src-tauri
      - name: Frontend typecheck + production build
        working-directory: wallet
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
      - name: Wallet backend tests (Tor config, keystore)
        working-directory: wallet/src-tauri
        run: cargo test --locked

  formal:
    name: Lean proofs (formal/)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the Lean version pinned in formal/lean-toolchain and runs `lake build`,
      # which checks every proof in the library. The project has no dependencies.
      - name: Build (machine-check every proof)
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          lake-package-directory: formal
          use-github-cache: false
      # A proof left as `sorry` still builds (with a warning). This is what turns it, a
      # native_decide or a new axiom into a failure.
      - name: Axiom audit (no sorry, no axiom beyond Lean's standard three)
        working-directory: formal
        run: lake env lean Axioms.lean

  mainnet-from-testnet:
    name: Only testnet merges to mainnet
    if: github.event_name == 'pull_request' && github.base_ref == 'mainnet'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Head branch is testnet
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$HEAD" != "testnet" ]; then
            echo "Pull requests into mainnet must come from the testnet branch (this one is '$HEAD')."
            echo "That branch is mainnet code which has not shipped yet. It is not a separate chain."
            exit 1
          fi

  live-e2e:
    name: 3-node network + all live drivers
    # Push to testnet or mainnet, a pull request into either, the nightly, or a manual run.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/mainnet' || github.ref == 'refs/heads/testnet')) ||
      (github.event_name == 'pull_request' && (github.base_ref == 'mainnet' || github.base_ref == 'testnet'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      checks: read    # read this job's earlier results on the same tree
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2   # the parents: a merge commit has the tree of the branch it merged
      # Same files, same result: skip when this job already ran IN FULL and passed on a
      # commit whose tree is identical to this one (this commit, or a parent of a merge).
      # Only a run whose e2e step itself succeeded counts, so a skipped run is never the
      # evidence for another skip. Any doubt (no match, an API error) runs the job.
      - name: Has this exact code already passed this job?
        id: prior
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: 3-node network + all live drivers
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          now=$(date +%s)
          for c in HEAD HEAD^1 HEAD^2; do
            sha=$(git rev-parse --verify -q "$c^{commit}") || continue
            [ "$(git rev-parse "$sha^{tree}")" = "$tree" ] || continue
            ids=$(gh api -X GET "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs" \
                    -f check_name="$JOB_NAME" -f status=completed -f filter=all -F per_page=100 \
                    --jq '.check_runs[] | select(.conclusion == "success" and .app.slug == "github-actions") | .id') || continue
            for id in $ids; do
              row=$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$id" \
                      --jq '[([.steps[] | select(.name | startswith("Full live e2e")) | .conclusion] | first // "none"), .completed_at, .html_url] | @tsv') || continue
              IFS=$'\t' read -r e2e done url <<<"$row"
              [ "$e2e" = "success" ] || continue
              age=$(( now - $(date -d "$done" +%s) )) || continue
              [ "$age" -lt 604800 ] || continue
              echo "The full job passed on commit $sha (tree $tree), finished $done:"
              echo "  $url"
              echo "Identical files, so it is not run again."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Skipped: the full run on identical files passed at $done: $url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            done
          done
          echo "No full, passing run on this tree ($tree) in the last seven days: running the job."
      - name: Free runner disk space (images + prover build need it)
        if: steps.prior.outputs.skip != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Native build deps (drivers build the prover locally, wallet test links Tauri)
        if: steps.prior.outputs.skip != 'true'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            clang libclang-dev cmake pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev
      - name: Cache cargo build
        if: steps.prior.outputs.skip != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            impl
            wallet/src-tauri
          shared-key: live-e2e
      - name: Show toolchain
        if: steps.prior.outputs.skip != 'true'
        working-directory: impl
        run: rustup show
      # Docker + docker compose + python3 + curl are preinstalled on ubuntu-latest.
      - name: Full live e2e (fresh 3-node net -> all drivers -> teardown)
        if: steps.prior.outputs.skip != 'true'
        run: KEEP=0 ./chain/e2e/run-all.sh
